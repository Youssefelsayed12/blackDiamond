<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام EL-MARAKBI - النسخة المتكاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .chart-container { position: relative; height: 180px; width: 100%; }
        input::placeholder { color: #475569; }
        .modal { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="min-h-screen">

    <div id="loginScreen" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700 text-center">
            <div class="text-5xl mb-6">💎</div>
            <h2 class="text-2xl font-bold mb-8 text-indigo-400">تسجيل الدخول للنظام</h2>
            <div class="space-y-5 text-right">
                <div>
                    <label class="block text-sm text-gray-400 mb-2 mr-1">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" placeholder="أدخل البريد الإلكتروني..." class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white outline-none focus:border-indigo-500 transition-all text-right">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2 mr-1">كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور..." class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-white outline-none focus:border-indigo-500 transition-all text-right">
                </div>
                <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3.5 rounded-xl font-bold text-lg shadow-lg transition-all transform active:scale-95 mt-4">دخول للنظام</button>
            </div>
            <p id="loginError" class="text-red-500 text-sm mt-5 hidden bg-red-900/20 py-2 rounded-lg border border-red-900/50">خطأ في البيانات!</p>
        </div>
    </div>

    <div id="dashboardScreen" class="hidden container mx-auto px-4 py-6">
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg">
            <div class="text-right">
                <h1 class="text-2xl font-black text-white tracking-widest">EL-MARAKBI <span class="text-indigo-500 text-xs font-normal italic">PRO</span></h1>
                <p class="text-xs text-gray-400 mt-1 italic">مرحباً: <span id="currentUserName" class="text-indigo-400 font-bold"></span></p>
            </div>
            <div class="flex gap-2">
                <button onclick="location.reload()" class="bg-red-900/30 hover:bg-red-600 text-red-200 px-4 py-2 rounded-xl text-sm transition-all border border-red-800/50">خروج</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-1">
                <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 sticky top-6 shadow-2xl border-t-4 border-t-indigo-500">
                    <h3 class="font-bold mb-6 text-sm text-indigo-400 border-b border-gray-700 pb-2 italic uppercase">✚ إضافة عملية</h3>
                    <form id="clientForm" onsubmit="addClient(event)" class="space-y-4">
                        <input type="text" id="clientName" placeholder="اسم العميل" required class="w-full px-3 py-3 bg-gray-900 border border-gray-700 rounded-xl text-xs outline-none">
                        <input type="tel" id="clientPhone" placeholder="رقم الهاتف" required class="w-full px-3 py-3 bg-gray-900 border border-gray-700 rounded-xl text-xs outline-none">
                        <input type="email" id="clientEmail" placeholder="البريد الإلكتروني" class="w-full px-3 py-3 bg-gray-900 border border-gray-700 rounded-xl text-xs outline-none">
                        <input type="text" id="clientAddress" placeholder="عنوان العميل" class="w-full px-3 py-3 bg-gray-900 border border-gray-700 rounded-xl text-xs outline-none">
                        <input type="text" id="clientJobType" placeholder="نوع الخدمة" required class="w-full px-3 py-3 bg-gray-900 border border-gray-700 rounded-xl text-xs outline-none">
                        <input type="number" id="clientPrice" placeholder="المبلغ" required class="w-full px-3 py-3 bg-gray-900 border border-gray-700 rounded-xl text-xs outline-none">
                        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 py-3.5 rounded-xl font-bold text-sm shadow-lg transition-all hover:bg-emerald-700">حفظ في السحابة</button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-3 bg-gray-800 rounded-2xl border border-gray-700 shadow-xl overflow-hidden">
                <table class="w-full text-right text-xs table-auto">
                    <thead class="bg-gray-900/80 uppercase tracking-widest text-gray-400">
                        <tr>
                            <th class="p-4">البيانات</th>
                        </tr>
                    </thead>
                    <tbody id="clientTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://haznqxasxmwcxlpzxzan.supabase.co";
        const SUPABASE_KEY = "sb_publishable_bcN3M6Ih0Y3Fhf3bk873GQ_Sd4p4BOy";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            if (email === "admin@company.com" && pass === "Admin123*") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                loadClientsFromSupabase();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        async function loadClientsFromSupabase() {
            // تم التعديل هنا: اسم الجدول clients1
            const { data, error } = await _supabase.from('clients1').select('*').order('id', { ascending: false });
            if (error) console.error(error);
            else renderTable(data);
        }

        async function addClient(e) {
            e.preventDefault();
            const now = new Date();
            const newC = {
                date: now.toISOString().split('T')[0],
                time: now.toLocaleTimeString(),
                name: document.getElementById('clientName').value,
                phone: document.getElementById('clientPhone').value,
                email: document.getElementById('clientEmail').value || 'لا يوجد',
                address: document.getElementById('clientAddress').value || 'لا يوجد',
                job_type: document.getElementById('clientJobType').value,
                price: parseFloat(document.getElementById('clientPrice').value)
            };

            // تم التعديل هنا: اسم الجدول clients1
            const { error } = await _supabase.from('clients1').insert([newC]);
            if (error) alert("خطأ: " + error.message);
            else { alert("تم الحفظ بنجاح!"); e.target.reset(); loadClientsFromSupabase(); }
        }

        function renderTable(data) {
            const tbody = document.getElementById('clientTableBody');
            tbody.innerHTML = data.map(c => `<tr><td class="p-4">${c.name} - ${c.price} EGP</td></tr>`).join('');
        }
    </script>
</body>
</html>
