name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project from the website's index.html
        run: |
          INDEX=$(git ls-files | grep -E '(^|/)index\.html$' | head -1)
          echo "Using $INDEX"
          mkdir -p "$RUNNER_TEMP/app/www"
          cp "$INDEX" "$RUNNER_TEMP/app/www/index.html"
          cd "$RUNNER_TEMP/app"
          cat > package.json <<'JSON'
          {
            "name": "black-diamond-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/browser": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/filesystem": "^7.0.0",
              "@capacitor/local-notifications": "^7.0.0",
              "@capacitor/share": "^7.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.blackdiamond.app",
            "appName": "Black Diamond",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          npm install
          npx cap add android
          npx cap sync android

      - name: Build and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          cd "$RUNNER_TEMP/app/android"
          chmod +x gradlew
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bd.p12"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/bd.p12" --ks-alias blackdiamond \
              --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "$RUNNER_TEMP/BlackDiamond.apk" "$RUNNER_TEMP/aligned.apk"
          else
            echo "No signing key found - building a debug APK instead"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/BlackDiamond.apk"
          fi

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/BlackDiamond.apk" BlackDiamond.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk BlackDiamond.apk \
            --title "Black Diamond (Android)" \
            --notes "Latest Android build. Download BlackDiamond.apk and install it."
