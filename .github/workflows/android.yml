name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project from the website's index.html
        run: |
          INDEX=$(git ls-files | grep -E '(^|/)index\.html$' | head -1)
          echo "Using $INDEX"
          mkdir -p "$RUNNER_TEMP/app/www"
          cp "$INDEX" "$RUNNER_TEMP/app/www/index.html"
          LOGO=$(git ls-files | grep -E '(^|/)logo\.jpg$' | head -1)
          echo "Logo: $LOGO"
          cp "$LOGO" "$RUNNER_TEMP/app/www/logo.jpg"
          cd "$RUNNER_TEMP/app"
          cat > package.json <<'JSON'
          {
            "name": "black-diamond-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/browser": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/filesystem": "^7.0.0",
              "@capacitor/local-notifications": "^7.0.0",
              "@capacitor/share": "^7.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.blackdiamond.app",
            "appName": "Black Diamond",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          npm install
          npx cap add android
          npx cap sync android

      - name: Set app icon from logo
        run: |
          sudo apt-get install -y imagemagick
          RES="$RUNNER_TEMP/app/android/app/src/main/res"
          LOGO="$RUNNER_TEMP/app/www/logo.jpg"
          rm -rf "$RES"/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; sz=${d##*:}
            mkdir -p "$RES/mipmap-$n"
            convert "$LOGO" -resize ${sz}x${sz} "$RES/mipmap-$n/ic_launcher.png"
            convert "$LOGO" -resize ${sz}x${sz} -alpha set \( +clone -alpha transparent -fill white -draw "circle $((sz/2)),$((sz/2)) $((sz/2)),0" \) -compose DstIn -composite "$RES/mipmap-$n/ic_launcher_round.png"
            cp "$RES/mipmap-$n/ic_launcher.png" "$RES/mipmap-$n/ic_launcher_foreground.png"
          done
          ls "$RES"/mipmap-*

      - name: Build and sign APK
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          cd "$RUNNER_TEMP/app/android"
          chmod +x gradlew
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle
          if [ -f "$GITHUB_WORKSPACE/bd.p12" ] && [ -n "$KEY_PASSWORD" ]; then
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            cp "$GITHUB_WORKSPACE/bd.p12" "$RUNNER_TEMP/bd.p12"
            keytool -list -keystore "$RUNNER_TEMP/bd.p12" -st
